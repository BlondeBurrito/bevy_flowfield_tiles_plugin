name: Bench

on:
  push:
    branches: [none]
  pull_request:
    branches: [none]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Nix dependencies
        uses: ./.github/actions/install_linux_deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo bench -q --benches --workspace
