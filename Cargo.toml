[workspace.package]
version = "0.15.0"
authors = ["BlondeBurrito"]
edition = "2024"
rust-version = "1.97"
readme = "README.md"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/BlondeBurrito/bevy_flowfield_tiles_plugin"
repository = "https://github.com/BlondeBurrito/bevy_flowfield_tiles_plugin"
keywords = ["navigation", "pathfinding", "bevy"]
categories = ["game-development", "algorithms"]
exclude = [".github/", "crates/", "assets/", "docs/png/", "justfile"]

# [workspace]
# members = ["crates/*"]

# Centralised way of managing versions across all crates and packages
[workspace.dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_render", "wayland", "bevy_log"] }
serde = { version = "1", features = ["derive", "rc"] }
serde-big-array = { version = "0.5" }
ron = { version = "0.12" }
csv = { version = "1" }
photon-rs = { version = "0.3"}
petgraph = { version = "0.8", default-features = false, features = ["std", "stable_graph", "serde-1"] }

[workspace.lints.clippy]
cargo_common_metadata = "deny"
missing_docs_in_private_items = "deny"
todo = "deny"
unimplemented = "warn"
[workspace.lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(tarpaulin_include)'] }

[package]
name = "bevy_flowfield_tiles_plugin"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "An implementation of FlowField (vector field) pathfinding as a plugin to the Bevy game engine"
readme.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
exclude.workspace = true
publish = true

[dev-dependencies]
criterion = { version = "0.5", features = ["async_futures"] }
bevy = { workspace = true, default-features = true, features=["wayland", "system_font_discovery"]}
rand = "0.9"
avian2d = { version = "0.7", default-features = false, features = ["2d", "f32", "parry-f32", "default-collider", "parallel", "debug-plugin"]} # used in 2d examples for collision detection
# avian2d = { git = "https://github.com/Jondolf/avian", branch = "main", default-features = false, features = ["2d", "f32", "parry-f32", "default-collider", "parallel", "debug-plugin"]}

[dependencies]
bevy = { workspace = true, features = ["bevy_render", "wayland"] }
petgraph = { workspace = true }
serde = { workspace = true, optional = true }
serde-big-array = { workspace = true, optional = true }
ron = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
photon-rs = {workspace = true, optional = true }

[lints]
workspace = true

[features]
serde = ["dep:serde", "dep:serde-big-array"]
ron = ["serde", "dep:ron"]
2d = []
3d = []
heightmap = ["dep:photon-rs"]
# multithread = []

[package.metadata.docs.rs]
features = ["serde", "ron", "2d", "3d", "heightmap"]

[profile.dev]
opt-level = 1

[profile.flamegraph]
inherits = "release"
debug = true
strip = false

[profile.codecov]
inherits = "release"
strip = false

[profile.release]
codegen-units = 2
# lto = true # slow
strip = true # strip symbols to reduce binary size on linux and mac

[[bench]]
name = "calc_route"
harness = false

[[bench]]
name = "calc_flow_open"
harness = false

[[bench]]
name = "calc_flow_sparse"
harness = false

[[bench]]
name = "calc_flow_maze"
harness = false

[[bench]]
name = "init_bundle"
harness = false

[[bench]]
name = "init_costfields"
harness = false

[[bench]]
name = "init_portals"
harness = false

